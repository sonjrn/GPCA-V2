# Keeps a stack of dependent pull requests pointing at main, and rebased onto
# it, as the branches below them merge.
#
# The problem this solves: PR B is based on branch A while A is under review.
# When A merges, two things need to happen to B, and GitHub does at most one:
#
#   1. Retarget  -- B's base must become main. GitHub does this automatically,
#                   but ONLY when A's head branch is deleted on merge. With
#                   "Automatically delete head branches" off, B keeps pointing
#                   at a merged branch and silently drifts.
#   2. Rebase    -- B still carries A's commits. A squash merge gives them new
#                   SHAs in main, so those commits are duplicated rather than
#                   recognised as merged, and B conflicts on every file A
#                   touched. GitHub never does this part.
#
# Enabling "Automatically delete head branches" in Settings -> General covers
# (1) natively and is worth turning on regardless. This workflow covers both,
# so the stack survives a merge that happened some other way -- including into
# the wrong base.

name: Restack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One at a time. Two runs rebasing the same branches would race on the push.
concurrency:
  group: restack
  cancel-in-progress: false

jobs:
  restack:
    name: Retarget and rebase stacked PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A PAT here (secret RESTACK_TOKEN) makes the rebase pushes trigger
          # CI on the affected PRs. With the default GITHUB_TOKEN they will
          # not: GitHub deliberately refuses to start a workflow run from a
          # push made with it, to stop workflows triggering themselves. The
          # rebase still happens; its checks just stay stale until the next
          # push. The job says so on the PR when that applies.
          token: ${{ secrets.RESTACK_TOKEN || github.token }}

      - name: Retarget PRs whose base has been merged
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
        run: |
          set -euo pipefail

          gh pr list --state open --json number,baseRefName \
            --jq '.[] | [.number, .baseRefName] | @tsv' > prs.tsv

          while IFS=$'\t' read -r number base; do
            if [ "$base" = "main" ]; then
              continue
            fi

            # Still a real branch carrying work of its own? Then the
            # dependency is genuinely open and the PR is correctly targeted.
            if git rev-parse --verify --quiet "origin/$base" >/dev/null; then
              if [ -n "$(git log --oneline "origin/main..origin/$base")" ]; then
                echo "PR #$number: base $base still has unmerged commits, leaving it"
                continue
              fi
            fi

            echo "PR #$number: base $base is merged or gone, retargeting to main"
            gh pr edit "$number" --base main
          done < prs.tsv

      - name: Rebase main-targeted PRs that have fallen behind
        env:
          GH_TOKEN: ${{ secrets.RESTACK_TOKEN || github.token }}
          HAS_PAT: ${{ secrets.RESTACK_TOKEN != '' }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          footer='\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_'

          conflict_msg='This PR could not be rebased onto `main` automatically -- the rebase hit a conflict.\n\nRebase locally and force-push:\n\n```\ngit fetch origin\ngit rebase origin/main\ngit push --force-with-lease\n```'

          drift_msg='This PR was left alone: rebasing it onto `main` changed its diff, which usually means part of it has already landed in `main` by another route. Worth a look before rebasing by hand.'

          stale_msg='Rebased onto `main` automatically. **The checks above are stale** -- they ran against the previous head.\n\nGitHub does not start workflow runs from pushes made with the default `GITHUB_TOKEN`, so CI did not re-run. Push any commit, or re-run the checks manually, before merging. Setting a `RESTACK_TOKEN` secret removes this caveat.'

          gh pr list --state open --base main --json number,headRefName \
            --jq '.[] | [.number, .headRefName] | @tsv' > mainprs.tsv

          while IFS=$'\t' read -r number head; do
            if ! git rev-parse --verify --quiet "origin/$head" >/dev/null; then
              continue
            fi

            # Already on top of main? Pushing anyway would burn a CI cycle for
            # no change.
            if git merge-base --is-ancestor origin/main "origin/$head"; then
              echo "PR #$number ($head): already current"
              continue
            fi

            before=$(git rev-parse "origin/$head")
            git checkout -q -B restack-work "origin/$head"

            if ! git rebase origin/main >/dev/null 2>&1; then
              git rebase --abort || true
              echo "PR #$number ($head): conflicts, leaving for a human"
              gh pr comment "$number" --body "$(printf "%b" "$conflict_msg$footer")"
              continue
            fi

            # The rebase must not change what the PR does. If the diff against
            # main differs from what it was, something was silently dropped or
            # duplicated -- back out rather than push it.
            if ! diff -q \
              <(git diff "origin/main...$before") \
              <(git diff "origin/main...HEAD") >/dev/null; then
              echo "PR #$number ($head): rebase changed the diff, leaving for a human"
              gh pr comment "$number" --body "$(printf "%b" "$drift_msg$footer")"
              continue
            fi

            git push --force-with-lease origin "HEAD:$head"
            echo "PR #$number ($head): rebased onto main"

            if [ "$HAS_PAT" != "true" ]; then
              gh pr comment "$number" --body "$(printf "%b" "$stale_msg$footer")"
            fi
          done < mainprs.tsv
