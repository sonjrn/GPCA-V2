# Alembic lives beside the models it version-controls (design 12.5).
# The database URL is NOT set here: env.py reads DATABASE_URL, so the same
# migrations run unchanged in dev, CI and production.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Revision files sort by their filename, so a date prefix keeps `ls versions/`
# in the order the migrations actually apply.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
