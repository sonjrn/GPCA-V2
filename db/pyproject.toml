[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpca-db"
version = "0.1.0"
description = "GPCA persistence layer: SQLAlchemy models, queries and Alembic migrations."
requires-python = ">=3.12"

# Deliberately minimal. This package must not grow a dependency on a web
# framework, a validation library, or an SDK -- see docs/technical-design.md
# section 2.3. The ban is enforced by db/ruff.toml.
dependencies = [
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    # UUIDv7 generation. The standard library gains uuid.uuid7 in Python 3.14;
    # this dependency goes away when the project moves to it.
    "uuid6>=2024.7.10",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff>=0.5", "pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["gpca_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
