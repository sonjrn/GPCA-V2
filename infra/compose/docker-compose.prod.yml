# Production overrides. Applied on top of the base file:
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.prod.yml up -d
#
# Every secret here comes from the real environment with no default. A missing
# value must fail the deploy, which is why none of these use `:-`.

name: gpca

services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    # !reset, not `ports: []`: Compose MERGES sequences, so an empty list
    # appends nothing and leaves the base file's published port in place. That
    # would expose PostgreSQL on the host in production.
    ports: !reset []
    restart: unless-stopped

  minio:
    ports: !reset []
    restart: unless-stopped

  migrate:
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}

  api:
    # The runtime stage: code copied in, no compiler, no bind mount, no reload.
    build:
      target: runtime
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      DATABASE_URL: ${DATABASE_URL:?required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?required}
      SES_FROM_ADDRESS: ${SES_FROM_ADDRESS:?required}
      AWS_REGION: ${AWS_REGION:?required}
    # Same reason: without !reset the dev source bind mount survives into
    # production and shadows the code copied into the image.
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped

  nginx:
    # !override replaces the list rather than adding to it, so the dev 8080
    # mapping does not linger alongside 80.
    ports: !override
      - "80:80"
    restart: unless-stopped
