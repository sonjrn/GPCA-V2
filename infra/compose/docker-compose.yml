# The composition root: what every environment shares. It publishes no host
# ports and mounts no source, so it is not a runnable stack on its own -- pair
# it with an overlay that adds those:
#
#   docker compose -f infra/compose/docker-compose.yml \
#                  -f infra/compose/docker-compose.dev.yml up
#
# Overlays only ever ADD here. That is deliberate: Compose MERGES sequences
# across -f files, so a `ports: []` in an overlay appends nothing and leaves
# the base file's published port in place. Removing an inherited list needs
# Compose's !reset tag, which the default YAML loader cannot parse -- and one
# forgotten !reset on a future service silently publishes it. Keeping the base
# free of host-facing settings means nothing ever has to be taken away.
#
# Four services, matching design 2.2: there is no broker and no worker.
# Deferred work is a CLI command run by hand (design 11).

name: gpca

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gpca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gpca}
      POSTGRES_DB: ${POSTGRES_DB:-gpca}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # -d as well as -U: without the database name pg_isready reports ready
      # while the named database is still being created on first boot.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gpca} -d ${POSTGRES_DB:-gpca}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # One-shot: creates the media bucket and makes it public-read, so uploaded
  # images are servable without presigning every GET (design 5.9).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET_MEDIA:-gpca-media} &&
      mc anonymous set download local/${S3_BUCKET_MEDIA:-gpca-media}
      "
    restart: "no"

  # One-shot, and the reason api waits on it: several gunicorn workers each
  # running `alembic upgrade` would race the schema (design 12.7).
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: runtime
    working_dir: /app/db
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gpca}:${POSTGRES_PASSWORD:-gpca}@db:5432/${POSTGRES_DB:-gpca}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      # The deployable image: code copied in, no compiler, no reload. The dev
      # overlay switches this to the `dev` stage.
      target: runtime
    # Interpolation defaults stay here rather than moving to the dev overlay.
    # `${VAR:-x}` is resolved against the host environment when Compose parses
    # the file, not against a service's `environment:` block, so an overlay
    # cannot supply them for values embedded in a command or entrypoint -- see
    # minio-init. Keeping them together is better than splitting the rule.
    # They are throwaway values for a local stack; a deployment supplies the
    # real ones through the environment.
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-not-a-real-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-not-a-real-secret}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gpca}:${POSTGRES_PASSWORD:-gpca}@db:5432/${POSTGRES_DB:-gpca}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-gpca-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # python rather than curl, which the slim image does not carry.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  minio_data:
