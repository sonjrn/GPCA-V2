# Reverse proxy in front of the API.

upstream gpca_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Uploads go directly to object storage with a presigned PUT (design 8),
    # so nothing large should traverse nginx. This is a guard, not a limit the
    # application relies on.
    client_max_body_size 2m;

    # Probes are unversioned infrastructure endpoints and are not logged, so a
    # health check every few seconds does not bury real traffic.
    location = /health {
        access_log off;
        proxy_pass http://gpca_api;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://gpca_api;
    }

    location / {
        proxy_pass http://gpca_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the caller's correlation id through, or let the app generate
        # one. Either way the same id appears in nginx and application logs.
        proxy_set_header X-Request-ID $http_x_request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
