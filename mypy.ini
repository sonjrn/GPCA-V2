[mypy]
python_version = 3.14
files = api/app, db/gpca_db
strict = True

# Surface the things strict mode leaves as warnings.
warn_unreachable = True
warn_no_return = True
disallow_any_unimported = True
show_error_codes = True
pretty = True

# Third-party packages ship their own stubs or are typed; add per-module
# overrides here rather than loosening the global settings.
