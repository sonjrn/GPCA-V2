# Root lint/format configuration, inherited by every package.
# db/ruff.toml extends this file and adds the import-boundary rules.

target-version = "py314"
line-length = 100
src = ["api", "db"]

# Markdown is excluded deliberately: `ruff format` reformats Python code blocks
# embedded in .md files, which rewrites the hand-aligned snippets in
# docs/technical-design.md on every run. Those snippets are illustrative and
# reference types that do not exist yet, so formatting them is pure churn.
exclude = [".git", ".venv", "venv", "__pycache__", "build", "dist", "ui", "*.md"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports (TID251 powers the db/ import ban)
    "PTH",  # flake8-use-pathlib
    "ARG",  # flake8-unused-arguments
    "RUF",  # ruff-specific
]
# The formatter owns line breaking; E501 only fires on strings and comments it
# cannot wrap, where it is noise rather than signal.
ignore = ["E501"]

[lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[lint.isort]
known-first-party = ["app", "gpca_db"]

[lint.per-file-ignores]
# N818 asks for an -Error suffix on every exception. These are named for the
# HTTP status they map to, matching docs/technical-design.md 3.4 and reading
# better where they are raised: `raise NotFound("breeder listing", slug)`.
"api/app/errors.py" = ["N818"]
# Same reasoning: TokenExpired/TokenInvalid read better at the raise site than
# TokenExpiredError, and they sit under a TokenError base that does carry it.
"api/app/security/tokens.py" = ["N818"]

[format]
docstring-code-format = true
